[package]
name = "gitbots"
description = "Agent-native git: identity, activity ledger, workrooms, actions. CLI + MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gitbots"
path = "src/main.rs"

[dependencies]
gitbots-actions.workspace = true
gitbots-cloud.workspace = true
gitbots-core.workspace = true
gitbots-git.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
mime_guess.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }
rmcp = { version = "3.5", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
ulid = "3"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
