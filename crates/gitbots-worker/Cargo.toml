[package]
name = "gitbots-worker"
description = "gitbots's Cloudflare control plane: /v1 API, ledger indexer and hosted dashboard API over Cloudflare Artifacts."
version = "0.1.0"
edition = "2024"
# workers-rs 0.8 needs Rust 1.91 (see rust-toolchain.toml).
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/gstohl/gitbots"
publish = false

# Built on its own (wasm32 only, own lockfile): the root workspace excludes it.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gitbots-cloud = { path = "../gitbots-cloud" }
gitbots-core = { path = "../gitbots-core" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
# Deadline support on wasm32 goes through `performance.now()`.
similar = { version = "3.2", features = ["wasm32_web_time"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8.7", features = ["d1", "queue"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
